<style>
/* ═══════════════════════════════════════════════════════════════════════════
   grace-board v4-B — «Четыре станции». Канбан остаётся главным объектом.
   Меняются три вещи и только они:
     1. Восемь станций схлопываются в четыре: Backlog · В очереди · В работе · Готово.
        Четыре агентские станции — это одно состояние, фаза пишется на карточке.
     2. Колонки перестают быть одинаковой ширины: широкая та, которую читают.
     3. Рельс прогона сворачивается в строку и больше не съедает треть экрана.
   Карточки, дроп-зоны и рычаг работают ровно как сегодня — это самый дешёвый вариант.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#E7EBF1; --bg-2:#EEF1F6; --well:#DFE4EC; --surface:#FFFFFF; --surface-2:#F4F6FA;
  --line:#D4DBE5; --line-2:#BFC8D6;
  --ink:#1B2027; --ink-soft:#525C6B; --ink-faint:#868F9E;
  --s-backlog:#6B7480; --s-todo:#2F73C2; --s-asking:#C98A12; --s-implementing:#D85B22;
  --s-verifying:#8B53E0; --s-reviewing:#149B8B; --s-ready:#2E9E50; --s-blocked:#D33F35;
  --ember:#D85B22; --amber:#E6A11E;
  --radius:13px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(27,40,68,.06),0 8px 22px rgba(27,40,68,.07);
  --shadow-lift:0 2px 6px rgba(27,40,68,.10),0 20px 44px rgba(27,40,68,.14);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --sans:"Hanken Grotesk",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  /* сетка: ширины колонок НЕ равны — очередь узкая, работа широкая */
  --w-backlog:296px; --w-queue:296px; --w-work:minmax(380px,1fr); --w-done:264px;
  --card-pad:10px; --fs:13px; --fs-mono:10.5px;
}
body[data-d="comfy"]{ --card-pad:14px; --fs:14px; --fs-mono:11px; }
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
  background:
    radial-gradient(1200px 600px at 80% -10%,rgba(216,91,34,.05),transparent 60%),
    radial-gradient(900px 520px at 10% 110%,rgba(47,115,194,.05),transparent 60%),
    var(--bg);
}
.console{display:flex;align-items:center;gap:18px;padding:12px 22px;border-bottom:1px solid var(--line);
  background:rgba(238,241,246,.9);backdrop-filter:blur(10px);flex:none}
.console__brand{display:flex;align-items:center;gap:12px}
.console__mark{width:28px;height:28px;border-radius:9px;border:2.4px solid var(--ember);position:relative;flex:none;box-shadow:0 0 0 4px rgba(216,91,34,.08)}
.console__mark::after{content:"";position:absolute;inset:0;margin:auto;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.console__title{font-family:var(--display);font-weight:800;font-size:19px;margin:0;letter-spacing:-.02em;white-space:nowrap}
.console__title span{color:var(--ember)}
.console__sub{margin:1px 0 0;font-size:11px;color:var(--ink-faint);font-family:var(--mono)}
/* «Требует меня» здесь не зона, а кнопка-счётчик: клик фильтрует доску */
.needme{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;cursor:pointer;
  border-radius:999px;padding:6px 13px;border:1px solid rgba(230,161,30,.5);background:rgba(230,161,30,.13);color:#8a5e08}
.needme b{font-size:13px}
.needme.is-on{background:var(--amber);color:#3a2706;border-color:var(--amber)}
.needme--calm{border-color:rgba(46,158,80,.35);background:rgba(46,158,80,.10);color:#1f7a42;cursor:default}
.tools{margin-left:auto;display:flex;align-items:center;gap:9px}
.find input{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;width:180px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:3px;gap:3px}
.seg__opt{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-soft);background:none;border:none;border-radius:6px;padding:5px 10px;cursor:pointer}
.seg__opt.is-on{color:#fff;background:var(--ember)}
.btn{font-family:var(--display);font-weight:600;font-size:13.5px;border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap;border:1px solid transparent}
.btn--solid{color:#fff;background:var(--ember)}
.btn--run{color:#fff;background:var(--s-verifying)}
.btn--ghost{color:var(--ink-soft);background:var(--surface);border-color:var(--line-2)}

/* ── свёрнутые рельсы: строка на прогон, а не треть экрана ─────────────── */
.rails{flex:none;padding:12px 22px 0;display:flex;flex-direction:column;gap:7px}
.rail{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;align-items:center;gap:12px;
  background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--line-2);
  border-left:4px solid var(--s-verifying);border-radius:var(--radius);padding:8px 14px;cursor:pointer}
.rail--auto{border-left-color:var(--s-ready)}
.rail__badge{font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:#fff;background:var(--s-verifying);border-radius:5px;padding:2px 7px}
.rail--auto .rail__badge{background:var(--s-ready)}
.rail__t{font-family:var(--display);font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
.mini-dag{display:flex;align-items:center;gap:3px}
.md{width:13px;height:13px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;
  font-family:var(--mono);font-size:7.5px;color:#fff;font-weight:700}
.md--done{background:var(--s-ready)} .md--live{background:var(--s-implementing);animation:pulse 1.5s ease-in-out infinite}
.md--blocked{background:var(--s-blocked)}
.chip{font-family:var(--mono);font-size:var(--fs-mono);color:var(--ink-soft);background:var(--surface);
  border:1px solid var(--line);border-radius:6px;padding:3px 8px;white-space:nowrap;text-decoration:none}
.chip--branch{color:var(--s-todo);border-color:rgba(47,115,194,.35);background:rgba(47,115,194,.06)}
.chip--ask{color:#8a5e08;border-color:rgba(230,161,30,.45);background:rgba(230,161,30,.10)}
.chip--auto{color:#1f7a42;border-color:rgba(46,158,80,.4);background:rgba(46,158,80,.08)}
.chip--ok{color:#1f7a42;border-color:rgba(46,158,80,.4);background:rgba(46,158,80,.07)}
.chip--bad{color:#a8362e;border-color:rgba(211,63,53,.45);background:rgba(211,63,53,.07)}
.rail__only{font-family:var(--mono);font-size:var(--fs-mono);color:var(--ink-soft);background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;cursor:pointer}
.rail__only.is-on{background:var(--s-verifying);border-color:var(--s-verifying);color:#fff}

/* ── доска: четыре станции, разной ширины, без горизонтального скролла ── */
.board{flex:1;display:grid;grid-template-columns:var(--w-backlog) 52px var(--w-queue) var(--w-work) var(--w-done);
  gap:14px;padding:14px 22px 18px;min-height:0}
.station{display:flex;flex-direction:column;min-height:0}
.station__head{display:flex;align-items:center;gap:9px;padding:0 4px 9px;flex:none}
.station__lamp{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.station__name{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:-.01em}
.station__count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-soft);background:var(--surface);
  border:1px solid var(--line);min-width:22px;text-align:center;padding:1px 7px;border-radius:999px}
.station__act{font-family:var(--mono);font-size:10px;color:var(--s-todo);background:none;border:none;cursor:pointer;padding:2px 5px;border-radius:5px}
.station__act:hover{background:var(--surface-2)}
.well{flex:1;border-radius:var(--radius);background:var(--well);padding:7px;overflow-y:auto;overscroll-behavior:contain;min-height:80px;
  display:flex;flex-direction:column;gap:7px}
.station--backlog .well{background:linear-gradient(var(--bg-2),var(--well));border:1px solid var(--line)}
.well__empty{font-family:var(--mono);font-size:11px;color:var(--ink-faint);text-align:center;padding:20px 10px;line-height:1.6;white-space:pre-line}
.lever{align-self:stretch;margin-top:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative}
.lever::before{content:"";position:absolute;top:24px;bottom:24px;left:50%;width:2px;
  background:repeating-linear-gradient(var(--ember) 0 7px,transparent 7px 14px);opacity:.55;transform:translateX(-50%)}
.lever__knob{width:24px;height:24px;border-radius:50%;z-index:1;background:radial-gradient(circle at 35% 30%,#ffb27e,var(--ember));
  box-shadow:0 0 0 4px rgba(216,91,34,.14),0 4px 10px rgba(27,40,68,.2)}
.lever__label{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ember);writing-mode:vertical-rl;transform:rotate(180deg);z-index:1}

/* ── карточка: одна строка темы, факты вместо чипов, время на станции ── */
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-2);
  border-radius:var(--radius-sm);padding:var(--card-pad);box-shadow:var(--shadow);cursor:grab;flex:none}
.card:hover{box-shadow:var(--shadow-lift)}
.card__t{font-family:var(--display);font-weight:600;font-size:var(--fs);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card__m{display:flex;align-items:center;gap:7px;margin-top:6px;font-family:var(--mono);font-size:var(--fs-mono);color:var(--ink-faint);flex-wrap:wrap}
.card__m .st{color:var(--ink-soft)}
.card__stage{color:#6a3fc0;font-weight:700}
.card__lock{color:#8a5e08}
.card[data-col="backlog"]{border-left-color:var(--s-backlog)}
.card[data-col="todo"]{border-left-color:var(--s-todo)}
.card[data-col="asking"]{border-left-color:var(--s-asking)}
.card[data-col="implementing"]{border-left-color:var(--s-implementing)}
.card[data-col="verifying"]{border-left-color:var(--s-verifying)}
.card[data-col="reviewing"]{border-left-color:var(--s-reviewing)}
.card[data-col="ready"]{border-left-color:var(--s-ready)}
.card[data-col="blocked"]{border-left-color:var(--s-blocked)}
/* работающая карточка — единственная развёрнутая: фаза, возраст, действия */
.card--work{border-left-width:4px;box-shadow:0 0 0 3px rgba(216,91,34,.07),var(--shadow)}
.card--work .card__t{-webkit-line-clamp:3;font-size:15px}
.phase{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:#fff;
  background:var(--s-implementing);border-radius:5px;padding:2px 8px;text-transform:lowercase}
.lamp{width:8px;height:8px;border-radius:50%;box-shadow:0 0 7px currentColor;flex:none}
.card--work .lamp{animation:pulse 1.5s ease-in-out infinite}
.acts{display:flex;gap:6px;margin-top:9px}
.mini{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:7px;padding:5px 9px;cursor:pointer}
.mini:hover{color:var(--ink);border-color:var(--ink-soft)}
.ask{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:11px;color:#3a2706;font-weight:700;
  background:var(--amber);border-radius:var(--radius-sm);padding:7px 10px;cursor:pointer}
/* «Готово» — терминал с выходом: групповая уборка по закрытому прогону */
.sweep{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px dashed var(--line-2);
  border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);flex:none}
.sweep button{margin-left:auto}
.gauge{flex:none;display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);
  padding:0 22px 12px}
.gauge b{color:var(--ink-soft)} .gauge s{color:var(--s-blocked)}
.is-dim{opacity:.2}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;
  font-size:13px;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow-lift);display:none}
.toast[data-open="1"]{display:block}
.toast b{color:#ffb27e;font-family:var(--mono);font-weight:500}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.78)}}
:focus-visible{outline:2px solid var(--s-todo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1240px){.board{grid-template-columns:1fr 44px 1fr 1.4fr;}.station--done{display:none}}
</style>
</head>

c":"todo","ts":"2026-08-01T07:57:58.780Z","via":"plan-queued"},{"c":"asking","ts":"2026-08-01T08:15:38.363Z","via":"pipeline"},{"c":"implementing","ts":"2026-08-01T08:16:22.386Z","via":"auto-build"},{"c":"ready","ts":"2026-08-01T08:50:19.848Z","via":"pipeline"}],"archDecisions":[{"q":"Slug generation: python-slugify vs hand-rolled","chosen":"python-slugify","why":"python-slugify — проверенная библиотека с корректным Unicode-транслитом."},{"q":"SERVICE_IN_USE: какие таблицы проверять","chosen":"Case.service_id + ServiceActivationItem via ServiceProfile","why":"Проверяем все статусы — даже закрытый кейс ссылается на услугу."},{"q":"Casbin-интеграция для write-эндпоинтов","chosen":"require_permission по существующим правилам в CSV","why":"Права service create/update/delete уже засиданы в docsinside_policy.csv:32-35 для ds_admin."}],"autoN":3},{"id":"409a318a-724f-4d8f-a528-53fa9d9effa0","project":"DocsInside2","theme":"Docsinside · Услуги B+ · Профили услуги: цена в контракте, CRUD, версионирование","column":"ready","planId":"13dc2476","dependsOn":["f9e9e730-d6c0-4329-866f-4a9b36066f59"],"dispatchedAt":"2026-08-01T08:50:19.850Z","lastColumnChangeAt":"2026-08-01T09:11:22.471Z","queued":false,"files":7,"acceptance":7,"rigor":"grace","questions":0,"blockReason":null,"draft":false,"floor":0,"runLog":"/Users/vm/Projects/DocsInside2/.grace-feature-dev/docsinside-услуги-b-профили-услуги-цена-в-контра/build.log","desc":"# Профили услуги: цена в контракте, CRUD, версионирование Профиль — комбинация «услуга × категория заявителя × тип обращения», у каждой свой комплект документов, набор видимых шагов и цена (ТЗ §3.5). Модель `backend/app/domains/common/models/service_profile.py` уже держит всё нужное, включая `list_price` (Decimal 10,2, добавлена миграцией `0013`), но наружу цена не выходит: `ServiceProfileRead` (`schemas/service_prof…","history":[{"c":"backlog","ts":"2026-08-01T07:56:07.244Z","via":null},{"c":"todo","ts":"2026-08-01T07:57:58.780Z","via":"plan-queued"},{"c":"asking","ts":"2026-08-01T08:52:53.926Z","via":"pipeline"},{"c":"implementing","ts":"2026-08-01T08:53:51.964Z","via":"auto-build"},{"c":"ready","ts":"2026-08-01T09:11:22.471Z","via":"pipeline"}],"archDecisions":[{"q":"Транзакционность версионирования: нужна ли двухфазная блокировка или достаточно одной транзакции?","chosen":"Одна транзакция с SELECT FOR UPDATE","why":"Версионирование (deactivate old + insert new) выполняется в одной async-транзакции с SELECT FOR UPDATE на текущей строке. Partial unique index — страховка от race condition. Не требует distributed locks или saga — операция локальна в одной таблице."},{"q":"Формат вложенных документов/шагов в Create/Update: inline в теле или отдельные эндпоинты?","chosen":"Inline в теле запроса","why":"Контракт данных задан явно: documents[] и steps[] — вложенные массивы в ServiceProfileCreate/Update. Отдельные эндпоинты для управления документами/шагами профиля избыточны и противоречат заданному контракту. Сервис заменяет связанные записи целиком при каждом сохранении (replace strategy)."},{"q":"Стратегия замены связанных записей при версионировании: merge vs replace","chosen":"Replace (полная замена)","why":"При создании новой версии профиля documents[] и steps[] создаются заново, привязанные к новой строке профиля. Старые связи остаются на старой версии — кейсы ссылаются на неё. Merge (diff старых и новых) усложняет код без пользы: клиент всегда отправляет полный набор."}],"autoN":3},{"id":"7630c0aa-e5f2-46cd-a0c3-28c1efa71013","project":"DocsInside2","theme":"Docsinside · Услуги B+ · Биллинг по company_id из пути: активация, профили, агрегат пула","column":"ready","planId":"13dc2476","dependsOn":["409a318a-724f-4d8f-a528-53fa9d9effa0"],"dispatchedAt":"2026-08-01T09:11:22.474Z","lastColumnChangeAt":"2026-08-01T09:36:13.209Z","queued":false,"files":8,"acceptance":7,"rigor":"grace","questions":0,"blockReason":null,"draft":false,"floor":0,"runLog":"/Users/vm/Projects/DocsInside2/.grace-feature-dev/docsinside-услуги-b-биллин const NOW = Date.parse(DATA.updatedAt);
const AGENT = new Set(["asking","implementing","verifying","reviewing"]);
const PHASE = { asking:"вопросы", implementing:"пишет код", verifying:"проверяет", reviewing:"ревью", blocked:"стоит" };
const LAMP = { backlog:"var(--s-backlog)", todo:"var(--s-todo)", asking:"var(--s-asking)", implementing:"var(--s-implementing)",
  verifying:"var(--s-verifying)", reviewing:"var(--s-reviewing)", ready:"var(--s-ready)", blocked:"var(--s-blocked)" };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const card = (id) => DATA.cards.find((c) => c.id === id);
const plan = (id) => DATA.plans.find((p) => p.id === id);
function since(iso){ const t = Date.parse(iso || ""); if(!t) return "";
  const m = Math.round((NOW-t)/60000); if(m<60) return m+" мин";
  const h = Math.floor(m/60); return h<24 ? h+" ч" : Math.floor(h/24)+" дн"; }
function shortTheme(t){ const p = String(t||"").split(" · "); return p.length>2 ? p.slice(2).join(" · ") : (t||"—"); }
const stageNo = (c) => { const p = c.planId && plan(c.planId); return p ? { n:p.cardIds.indexOf(c.id)+1, m:p.cardIds.length, p } : null; };
function needAttention(c){ return (c.column==="asking" && c.questions>0) || c.column==="blocked" || c.floor>0 || c.draft; }

let onlyPlan = null, needOnly = false, q = "";

/* ── карточка ─────────────────────────────────────────────────────────── */
function cardHTML(c){
  const s = stageNo(c);
  const work = AGENT.has(c.column);
  const wait = (c.dependsOn||[]).map(card).filter((d)=>d && d.column!=="ready");
  const lock = wait.length && s ? `<span class="card__lock">🔒 ждёт S${s.p.cardIds.indexOf(wait[0].id)+1}</span>`
    : c.queued ? `<span class="card__lock">⏳ слот проекта занят</span>` : "";
  const acts = work ? `<div class="acts">
      <button class="mini" type="button" data-toast="Прототип: открывается просмотрщик «План · Лог»">⊟ лог</button>
      <button class="mini" type="button" data-toast="Прогон перезапущен">↻ перезапуск</button></div>` : "";
  const ask = (c.column==="asking" && c.questions>0)
    ? `<div class="ask">● ${c.questions} вопрос(ов) · ответь →</div>` : "";
  return `<article class="card${work ? " card--work" : ""}" data-col="${esc(c.column)}" data-id="${esc(c.id)}" data-plan="${esc(c.planId||"")}" draggable="true">
    <div class="card__t">${s ? `<span class="card__stage">S${s.n} · </span>` : ""}${esc(shortTheme(c.theme))}</div>
    <div class="card__m">
      <span class="lamp" style="color:${LAMP[c.column]};background:${LAMP[c.column]}"></span>
      ${work ? `<span class="phase" style="background:${LAMP[c.column]}">${esc(PHASE[c.column])}</span>` : ""}
      <span class="st">${esc(since(c.lastColumnChangeAt))} на станции</span>
      ${s ? `<span>· этап ${s.n}/${s.m}</span>` : `<span>· ${esc(c.project)}</span>`}
      ${c.files ? `<span>· ⎘ ${c.files}</span>` : ""}
      ${lock ? "· " + lock : ""}
    </div>${ask}${acts}</article>`;
}

/* ── станции ──────────────────────────────────────────────────────────── */
function pass(c){
  if (onlyPlan && c.planId !== onlyPlan) return false;
  if (needOnly && !needAttention(c)) return false;
  if (q && !(c.theme + " " + c.project).toLowerCase().includes(q)) return false;
  return true;
}
function stationHTML(key, name, cards, extra){
  return `<section class="station station--${key}">
    <header class="station__head">
      <span class="station__lamp" style="color:${LAMP[key]}"></span>
      <span class="station__name">${name}</span>
      <span class="station__count">${cards.length}</span>
      ${extra || ""}
    </header>
    <div class="well">${cards.length ? cards.map(cardHTML).join("") : `<div class="well__empty">—</div>`}</div>
  </section>`;
}
function renderBoard(){
  const cs = DATA.cards.filter(pass);
  const backlog = cs.filter((c)=>c.column==="backlog");
  const queue = cs.filter((c)=>c.column==="todo");
  /* Четыре агентские станции + blocked — это одно состояние «в работе».
     При WIP=1 их разделение давало четыре почти всегда пустые колонки. */
  const work = cs.filter((c)=>AGENT.has(c.column) || c.column==="blocked");
  const done = cs.filter((c)=>c.column==="ready");
  const sweeps = DATA.plans.filter((p)=>p.archived && p.cardIds.some((id)=>{const x=card(id);return x && x.column==="ready";}))
    .map((p)=>`<div class="sweep">✓ ${esc(p.goal.slice(0,34))}… · ${p.cardIds.filter((id)=>{const x=card(id);return x&&x.column==="ready";}).length} шт.
      <button class="mini" type="button" data-sweep="${esc(p.id)}">Убрать</button></div>`).join("");
  document.getElementById("board").innerHTML =
    stationHTML("backlog","Backlog",backlog) +
    `<div class="lever" title="перетащи карточку через рычаг"><span class="lever__knob"></span><span class="lever__label">launch</span></div>` +
    stationHTML("todo","В очереди",queue) +
    stationHTML("implementing","В работе",work,
      `<span class="station__act" title="при WIP=1 здесь почти всегда одна карточка">asking · implementing · verifying · reviewing</span>`) +
    `<section class="station station--done">
      <header class="station__head"><span class="station__lamp" style="color:${LAMP.ready}"></span>
        <span class="station__name">Готово</span><span class="station__count">${done.length}</span></header>
      <div class="well">${sweeps}${done.length ? done.map(cardHTML).join("") : `<div class="well__empty">—</div>`}</div>
    </section>`;
}

/* ── свёрнутые рельсы ─────────────────────────────────────────────────── */
function renderRails(){
  const live = DATA.plans.filter((p)=>!p.archived);
  document.getElementById("rails").innerHTML = live.map((p)=>{
    const cs = p.cardIds.map(card).filter(Boolean);
    const done = cs.filter((c)=>c.column==="ready").length;
    const dots = cs.map((c)=>{
      const k = c.column==="ready" ? "done" : c.column==="blocked" ? "blocked" : (AGENT.has(c.column) ? "live" : "wait");
      return `<span class="md md--${k}" title="${esc(c.theme)}">${k==="done"?"✓":""}</span>`;
    }).join("");
    const rest = cs.filter((c)=>c.column!=="ready").length;
    return `<div class="rail${p.mode==="auto"?" rail--auto":""}" data-plan="${esc(p.id)}">
      <span class="rail__badge">⚡ прогон</span>
      <h2 class="rail__t">${esc(p.goal)}</h2>
      <span class="mini-dag">${dots}</span>
      <span style="display:flex;gap:7px">
        <span class="chip">${done}/${cs.length}</span>
        <span class="chip chip--${p.mode==="auto"?"auto":"ask"}">${p.mode==="auto"?"✓ пройдёт сама":"🚩 остановит "+rest+" раз"}</span>
        <span class="chip chip--branch">⎇ ${esc(p.branch)}</span>
      </span>
      <button class="rail__only${onlyPlan===p.id?" is-on":""}" type="button" data-only="${esc(p.id)}">только этот</button>
    </div>`;
  }).join("");
}

/* ── шапка + метрика ──────────────────────────────────────────────────── */
function renderNeed(){
  const n = DATA.cards.filter(needAttention).length
    + DATA.plans.filter((p)=>p.closeStep==="awaiting-merge"||p.closeStep==="awaiting-deploy").length;
  const el = document.getElementById("needme");
  el.className = "needme" + (n ? (needOnly ? " is-on" : "") : " needme--calm");
  el.innerHTML = n ? `⚑ требует меня <b>${n}</b>` : `✓ тебя не ждут`;
  el.disabled = !n;
  return n;
}
function renderGauge(){
  const w = document.getElementById("board").clientWidth;
  document.getElementById("gauge").innerHTML =
    `<span>сетка v4-B: 4 станции в <b>${w}px</b>, горизонтального скролла <b>нет</b> (было <s>≈2500px</s>)</span>
     <span>областей прокрутки: <b>4</b> — по колонке (было <s>11</s>)</span>
     <span>рельс прогона: <b>44px</b> вместо <s>32vh</s></span>
     <span>карточка: <b>~62px</b> вместо <s>~190px</s></span>`;
}

document.addEventListener("click",(e)=>{
  const only = e.target.closest("[data-only]");
  if (only){ onlyPlan = onlyPlan===only.dataset.only ? null : only.dataset.only; renderAll(); return; }
  const sw = e.target.closest("[data-sweep]");
  if (sw){ const p = plan(sw.dataset.sweep); return toast(`Убрано с доски: <b>${p.cardIds.filter((id)=>{const x=card(id);return x&&x.column==="ready";}).length} карточек</b> · история и PR остались`); }
  const tt = e.target.closest("[data-toast]");
  if (tt) return toast(esc(tt.dataset.toast));
  const c = e.target.closest(".card");
  if (c) return toast(`Прототип: открывается карточка <b>${esc(shortTheme(card(c.dataset.id).theme).slice(0,40))}</b>`);
});
document.getElementById("needme").addEventListener("click",()=>{ needOnly = !needOnly; renderAll(); });
document.getElementById("density").addEventListener("click",(e)=>{
  const b = e.target.closest("[data-d]"); if(!b) return;
  document.body.dataset.d = b.dataset.d;
  document.querySelectorAll("#density .seg__opt").forEach((o)=>o.classList.toggle("is-on",o===b));
});
document.getElementById("find").addEventListener("input",(e)=>{ q = e.target.value.trim().toLowerCase(); renderBoard(); });
let toastTimer=null;
function toast(html){ const t=document.getElementById("toast"); t.innerHTML=html; t.dataset.open="1";
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>(t.dataset.open="0"),2600); }
window.addEventListener("resize",renderGauge);
function renderAll(){ renderNeed(); renderRails(); renderBoard(); renderGauge(); }
renderAll();
</script>
</body>
</html>
