<style>
/* ═══════════════════════════════════════════════════════════════════════════
   grace-board v4-C — «Инспектор». Мастер-деталь вместо канбана.
   Гипотеза: при WIP=1 колонки не несут информации — в любой момент читают ровно
   одну карточку. Слева узкий реестр всего, что есть на доске, справа — большая
   панель выбранного. Станции остаются словом (фаза), но перестают быть местом.
   Драг через рычаг здесь не главный жест: карточки двигает сервер, человек читает.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#E7EBF1; --bg-2:#EEF1F6; --well:#DFE4EC; --surface:#FFFFFF; --surface-2:#F4F6FA;
  --line:#D4DBE5; --line-2:#BFC8D6;
  --ink:#1B2027; --ink-soft:#525C6B; --ink-faint:#868F9E;
  --s-backlog:#6B7480; --s-todo:#2F73C2; --s-asking:#C98A12; --s-implementing:#D85B22;
  --s-verifying:#8B53E0; --s-reviewing:#149B8B; --s-ready:#2E9E50; --s-blocked:#D33F35;
  --ember:#D85B22; --amber:#E6A11E;
  --radius:13px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(27,40,68,.06),0 8px 22px rgba(27,40,68,.07);
  --shadow-lift:0 2px 6px rgba(27,40,68,.10),0 20px 44px rgba(27,40,68,.14);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --sans:"Hanken Grotesk",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --rail:344px; --row:32px; --fs:13px; --fs-mono:10.5px;
}
body[data-d="comfy"]{ --rail:392px; --row:40px; --fs:14px; --fs-mono:11px; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.console{display:flex;align-items:center;gap:18px;padding:11px 20px;border-bottom:1px solid var(--line);
  background:rgba(238,241,246,.92);backdrop-filter:blur(10px);flex:none}
.console__brand{display:flex;align-items:center;gap:11px}
.console__mark{width:27px;height:27px;border-radius:9px;border:2.4px solid var(--ember);position:relative;flex:none;box-shadow:0 0 0 4px rgba(216,91,34,.08)}
.console__mark::after{content:"";position:absolute;inset:0;margin:auto;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.console__title{font-family:var(--display);font-weight:800;font-size:18px;margin:0;letter-spacing:-.02em;white-space:nowrap}
.console__title span{color:var(--ember)}
.console__sub{margin:1px 0 0;font-size:10.5px;color:var(--ink-faint);font-family:var(--mono)}
.tools{margin-left:auto;display:flex;align-items:center;gap:9px}
.find input{font-family:var(--sans);font-size:13px;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;width:200px;color:var(--ink)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:3px;gap:3px}
.seg__opt{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-soft);background:none;border:none;border-radius:6px;padding:5px 10px;cursor:pointer}
.seg__opt.is-on{color:#fff;background:var(--ember)}
.btn{font-family:var(--display);font-weight:600;font-size:13.5px;border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn--solid{color:#fff;background:var(--ember)} .btn--run{color:#fff;background:var(--s-verifying)}
.btn--ghost{color:var(--ink-soft);background:var(--surface);border-color:var(--line-2)}

.split{flex:1;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:0}
/* ── реестр (левая колонка) — единственный список на доске ─────────────── */
.reg{border-right:1px solid var(--line);background:var(--bg-2);overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 24px}
.reg__grp{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);
  padding:14px 6px 7px;display:flex;align-items:center;gap:8px}
.reg__grp:first-child{padding-top:2px}
.reg__grp b{color:var(--ink-soft)}
.reg__grp em{margin-left:auto;font-style:normal;color:var(--ink-faint)}
.item{display:grid;grid-template-columns:16px minmax(0,1fr) auto;align-items:center;gap:9px;height:var(--row);
  padding:0 8px;border-radius:8px;cursor:pointer;color:var(--ink-soft)}
.item:hover{background:var(--surface-2)}
.item.is-sel{background:var(--surface);box-shadow:0 0 0 1px var(--line-2),var(--shadow);color:var(--ink)}
.item__d{width:9px;height:9px;border-radius:50%;justify-self:center;box-shadow:0 0 7px currentColor}
.item__t{font-size:var(--fs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item__r{font-family:var(--mono);font-size:var(--fs-mono);color:var(--ink-faint);white-space:nowrap}
.item--run{height:auto;padding:9px 8px;grid-template-columns:minmax(0,1fr);gap:6px}
.item--run .item__t{font-family:var(--display);font-weight:600;font-size:13px;white-space:normal;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item--need{background:rgba(230,161,30,.10);box-shadow:inset 0 0 0 1px rgba(230,161,30,.4)}
.item--need .item__t{color:#8a5e08;font-weight:600}
.minidag{display:flex;gap:3px;align-items:center}
.md{width:12px;height:12px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;
  font-family:var(--mono);font-size:7px;color:#fff;font-weight:700}
.md--done{background:var(--s-ready)} .md--live{background:var(--s-implementing);animation:pulse 1.5s ease-in-out infinite}
.md--blocked{background:var(--s-blocked)}
.item__meta{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:var(--fs-mono);color:var(--ink-faint)}
.calm{margin:2px 6px 0;padding:9px 11px;border-radius:9px;background:rgba(46,158,80,.09);border:1px solid rgba(46,158,80,.3);
  font-size:12.5px;color:#1f7a42}

/* ── инспектор (правая панель) ────────────────────────────────────────── */
.insp{overflow-y:auto;overscroll-behavior:contain;padding:22px 28px 40px}
.insp__wrap{max-width:820px;display:flex;flex-direction:column;gap:16px}
.insp__crumb{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.insp__crumb a{color:var(--s-todo);text-decoration:none;cursor:pointer}
.insp__t{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.18;letter-spacing:-.02em;margin:0}
.insp__facts{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--mono);font-size:11px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);
  border-radius:7px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.chip--branch{color:var(--s-todo);border-color:rgba(47,115,194,.35);background:rgba(47,115,194,.06)}
.chip--phase{color:#fff;background:var(--s-implementing);border-color:transparent}
.chip--ok{color:#1f7a42;border-color:rgba(46,158,80,.4);background:rgba(46,158,80,.07)}
.chip--bad{color:#a8362e;border-color:rgba(211,63,53,.45);background:rgba(211,63,53,.07)}
.chip--warn{color:#8a5e08;border-color:rgba(230,161,30,.45);background:rgba(230,161,30,.10)}
.lamp{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor;flex:none}
.lamp--live{animation:pulse 1.5s ease-in-out infinite}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.box__k{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);margin-bottom:7px}
.box__v{font-size:13.5px;line-height:1.6;color:var(--ink-soft);white-space:pre-wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.mini{font-family:var(--mono);font-size:11px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line-2);
  border-radius:8px;padding:7px 12px;cursor:pointer}
.mini:hover{color:var(--ink);border-color:var(--ink-soft)}
.mini--go{color:#fff;background:var(--s-asking);border-color:transparent;font-family:var(--display);font-weight:600;font-size:12.5px}
.mini--merge{color:#fff;background:var(--s-verifying);border-color:transparent;font-family:var(--display);font-weight:600;font-size:12.5px}
/* трек прогона внутри инспектора */
.track{display:flex;align-items:center;padding:4px 0 2px}
.node{display:inline-flex;align-items:center;gap:5px;flex:none;background:none;border:none;padding:0;cursor:pointer;position:relative;font:inherit}
.node__dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;
  font-weight:700;color:#fff;background:var(--line-2);border:2px solid var(--surface)}
.node__n{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.node--done .node__dot{background:var(--s-ready)}
.node--live .node__dot{background:var(--s-implementing);animation:pulse 1.5s ease-in-out infinite;box-shadow:0 0 0 3px rgba(216,91,34,.18)}
.node--blocked .node__dot{background:var(--s-blocked)}
.node.is-sel .node__n{color:var(--ink);font-weight:700}
.node.is-sel .node__dot{outline:2px solid var(--s-todo);outline-offset:2px}
.node__flag{position:absolute;top:-12px;left:3px;font-size:10px;color:var(--s-asking)}
.seg-line{flex:1;height:2px;background:var(--line-2);margin:0 4px;min-width:8px;border-radius:2px}
.seg-line--done{background:var(--s-ready);opacity:.55}
.srow{display:grid;grid-template-columns:26px 30px minmax(0,1fr) auto;gap:9px;align-items:center;height:30px;
  border-bottom:1px solid rgba(212,219,229,.6);cursor:pointer;font-size:13px;color:var(--ink-soft)}
.srow:last-child{border-bottom:none}
.srow:hover{background:var(--surface-2)}
.srow.is-sel{color:var(--ink);font-weight:600}
.srow__m{font-family:var(--mono);font-size:11px;text-align:center;color:var(--ink-faint)}
.srow__id{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}
.srow__t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow__r{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);white-space:nowrap}
.gauge{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);display:flex;gap:16px;flex-wrap:wrap;
  border-top:1px dashed var(--line-2);padding-top:12px}
.gauge b{color:var(--ink-soft)} .gauge s{color:var(--s-blocked)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;
  font-size:13px;padding:10px 18px;border-radius:999px;box-shadow:var(--shadow-lift);display:none}
.toast[data-open="1"]{display:block}
.toast b{color:#ffb27e;font-family:var(--mono);font-weight:500}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.78)}}
:focus-visible{outline:2px solid var(--s-todo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:900px){.split{grid-template-columns:1fr}.reg{display:none}}
</style>
</head>

c":"todo","ts":"2026-08-01T07:57:58.780Z","via":"plan-queued"},{"c":"asking","ts":"2026-08-01T08:15:38.363Z","via":"pipeline"},{"c":"implementing","ts":"2026-08-01T08:16:22.386Z","via":"auto-build"},{"c":"ready","ts":"2026-08-01T08:50:19.848Z","via":"pipeline"}],"archDecisions":[{"q":"Slug generation: python-slugify vs hand-rolled","chosen":"python-slugify","why":"python-slugify — проверенная библиотека с корректным Unicode-транслитом."},{"q":"SERVICE_IN_USE: какие таблицы проверять","chosen":"Case.service_id + ServiceActivationItem via ServiceProfile","why":"Проверяем все статусы — даже закрытый кейс ссылается на услугу."},{"q":"Casbin-интеграция для write-эндпоинтов","chosen":"require_permission по существующим правилам в CSV","why":"Права service create/update/delete уже засиданы в docsinside_policy.csv:32-35 для ds_admin."}],"autoN":3},{"id":"409a318a-724f-4d8f-a528-53fa9d9effa0","project":"DocsInside2","theme":"Docsinside · Услуги B+ · Профили услуги: цена в контракте, CRUD, версионирование","column":"ready","planId":"13dc2476","dependsOn":["f9e9e730-d6c0-4329-866f-4a9b36066f59"],"dispatchedAt":"2026-08-01T08:50:19.850Z","lastColumnChangeAt":"2026-08-01T09:11:22.471Z","queued":false,"files":7,"acceptance":7,"rigor":"grace","questions":0,"blockReason":null,"draft":false,"floor":0,"runLog":"/Users/vm/Projects/DocsInside2/.grace-feature-dev/docsinside-услуги-b-профили-услуги-цена-в-контра/build.log","desc":"# Профили услуги: цена в контракте, CRUD, версионирование Профиль — комбинация «услуга × категория заявителя × тип обращения», у каждой свой комплект документов, набор видимых шагов и цена (ТЗ §3.5). Модель `backend/app/domains/common/models/service_profile.py` уже держит всё нужное, включая `list_price` (Decimal 10,2, добавлена миграцией `0013`), но наружу цена не выходит: `ServiceProfileRead` (`schemas/service_prof…","history":[{"c":"backlog","ts":"2026-08-01T07:56:07.244Z","via":null},{"c":"todo","ts":"2026-08-01T07:57:58.780Z","via":"plan-queued"},{"c":"asking","ts":"2026-08-01T08:52:53.926Z","via":"pipeline"},{"c":"implementing","ts":"2026-08-01T08:53:51.964Z","via":"auto-build"},{"c":"ready","ts":"2026-08-01T09:11:22.471Z","via":"pipeline"}],"archDecisions":[{"q":"Транзакционность версионирования: нужна ли двухфазная блокировка или достаточно одной транзакции?","chosen":"Одна транзакция с SELECT FOR UPDATE","why":"Версионирование (deactivate old + insert new) выполняется в одной async-транзакции с SELECT FOR UPDATE на текущей строке. Partial unique index — страховка от race condition. Не требует distributed locks или saga — операция локальна в одной таблице."},{"q":"Формат вложенных документов/шагов в Create/Update: inline в теле или отдельные эндпоинты?","chosen":"Inline в теле запроса","why":"Контракт данных задан явно: documents[] и steps[] — вложенные массивы в ServiceProfileCreate/Update. Отдельные эндпоинты для управления документами/шагами профиля избыточны и противоречат заданному контракту. Сервис заменяет связанные записи целиком при каждом сохранении (replace strategy)."},{"q":"Стратегия замены связанных записей при версионировании: merge vs replace","chosen":"Replace (полная замена)","why":"При создании новой версии профиля documents[] и steps[] создаются заново, привязанные к новой строке профиля. Старые связи остаются на старой версии — кейсы ссылаются на неё. Merge (diff старых и новых) усложняет код без пользы: клиент всегда отправляет полный набор."}],"autoN":3},{"id":"7630c0aa-e5f2-46cd-a0c3-28c1efa71013","project":"DocsInside2","theme":"Docsinside · Услуги B+ · Биллинг по company_id из пути: активация, профили, агрегат пула","column":"ready","planId":"13dc2476","dependsOn":["409a318a-724f-4d8f-a528-53fa9d9effa0"],"dispatchedAt":"2026-08-01T09:11:22.474Z","lastColumnChangeAt":"2026-08-01T09:36:13.209Z","queued":false,"files":8,"acceptance":7,"rigor":"grace","questions":0,"blockReason":null,"draft":false,"floor":0,"runLog":"/Users/vm/Projects/DocsInside2/.grace-feature-dev/docsinside-услуги-b-биллин const NOW = Date.parse(DATA.updatedAt);
const AGENT = new Set(["asking","implementing","verifying","reviewing"]);
const PHASE = { backlog:"Backlog", todo:"в очереди", asking:"вопросы", implementing:"пишет код",
  verifying:"проверяет", reviewing:"ревью", ready:"готово", blocked:"стоит" };
const LAMP = { backlog:"var(--s-backlog)", todo:"var(--s-todo)", asking:"var(--s-asking)", implementing:"var(--s-implementing)",
  verifying:"var(--s-verifying)", reviewing:"var(--s-reviewing)", ready:"var(--s-ready)", blocked:"var(--s-blocked)" };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const card = (id) => DATA.cards.find((c) => c.id === id);
const plan = (id) => DATA.plans.find((p) => p.id === id);
function since(iso){ const t=Date.parse(iso||""); if(!t) return "";
  const m=Math.round((NOW-t)/60000); if(m<60) return m+" мин";
  const h=Math.floor(m/60); return h<24 ? h+" ч" : Math.floor(h/24)+" дн"; }
function shortTheme(t){ const p=String(t||"").split(" · "); return p.length>2 ? p.slice(2).join(" · ") : (t||"—"); }
const kind = (c) => !c ? "wait" : c.column==="blocked" ? "blocked" : c.column==="ready" ? "done"
  : (c.dispatchedAt && c.column!=="todo") ? "live" : "wait";
const needs = (c) => (c.column==="asking" && c.questions>0) || c.column==="blocked" || c.floor>0 || c.draft;
const mergeGates = () => DATA.plans.filter((p)=>p.closeStep==="awaiting-merge"||p.closeStep==="awaiting-deploy");
let sel = null, q = "";

/* ── реестр ───────────────────────────────────────────────────────────── */
function itemHTML(c, no){
  const k = kind(c);
  return `<div class="item${sel===c.id?" is-sel":""}${needs(c)?" item--need":""}" data-sel="${esc(c.id)}">
    <span class="item__d" style="color:${LAMP[c.column]};background:${LAMP[c.column]}"></span>
    <span class="item__t">${no?`<span class="item__r">S${no} </span>`:""}${esc(shortTheme(c.theme))}</span>
    <span class="item__r">${k==="live"?esc(PHASE[c.column]):esc(since(c.lastColumnChangeAt))}</span></div>`;
}
function renderReg(){
  const hit = (c) => !q || (c.theme+" "+c.project).toLowerCase().includes(q);
  const need = DATA.cards.filter((c)=>needs(c) && hit(c));
  const gates = mergeGates();
  const live = DATA.plans.filter((p)=>!p.archived);
  const loose = DATA.cards.filter((c)=>!c.planId && c.column!=="ready" && hit(c));
  const closed = DATA.plans.filter((p)=>p.archived && p.cardIds.some((id)=>card(id)));
  let h = `<div class="reg__grp"><b>Требует меня</b><em>${need.length+gates.length}</em></div>`;
  h += (need.length+gates.length)
    ? gates.map((p)=>`<div class="item item--need${sel===p.id?" is-sel":""}" data-sel="${esc(p.id)}">
        <span class="item__d" style="color:var(--s-verifying);background:var(--s-verifying)"></span>
        <span class="item__t">✋ ${esc(p.goal)}</span><span class="item__r">мерж</span></div>`).join("")
      + need.map((c)=>itemHTML(c)).join("")
    : `<div class="calm">✓ Никто не ждёт — конвейер идёт сам.</div>`;
  for (const p of live){
    const cs = p.cardIds.map(card).filter(Boolean);
    const done = cs.filter((c)=>c.column==="ready").length;
    const rest = cs.length - done;
    h += `<div class="reg__grp"><b>Прогон</b><em>${done}/${cs.length}</em></div>
      <div class="item item--run${sel===p.id?" is-sel":""}" data-sel="${esc(p.id)}">
        <span class="item__t">${esc(p.goal)}</span>
        <span class="item__meta"><span class="minidag">${cs.map((c)=>{
          const k=kind(c); return `<span class="md md--${k}" title="${esc(c.theme)}">${k==="done"?"✓":""}</span>`;}).join("")}</span>
          <span>${p.mode==="auto"?"✓ сама":"🚩 "+rest}</span></span></div>`
      + cs.filter(hit).map((c)=>itemHTML(c, p.cardIds.indexOf(c.id)+1)).join("");
  }
  h += `<div class="reg__grp"><b>Одиночные</b><em>${loose.length}</em></div>`;
  h += loose.length ? loose.map((c)=>itemHTML(c)).join("")
    : `<div class="calm" style="background:var(--surface);border-color:var(--line-2);color:var(--ink-faint)">Задач вне прогонов нет.</div>`;
  h += `<div class="reg__grp"><b>Закрытое</b><em>${closed.length}</em></div>`;
  h += closed.map((p)=>`<div class="item${sel===p.id?" is-sel":""}" data-sel="${esc(p.id)}">
      <span class="item__d" style="color:${p.closeStatus==="failed"?"var(--s-blocked)":"var(--s-ready)"};background:${p.closeStatus==="failed"?"var(--s-blocked)":"var(--s-ready)"}"></span>
      <span class="item__t">${esc(p.goal)}</span>
      <span class="item__r">${p.cardIds.filter(card).length} шт.</span></div>`).join("");
  document.getElementById("reg").innerHTML = h;
}

/* ── инспектор ────────────────────────────────────────────────────────── */
function trackHTML(p, selId){
  const cs = p.cardIds.map(card).filter(Boolean);
  return `<div class="track">${cs.map((c,i)=>{
    const k = kind(c), dot = k==="done"?"✓":k==="live"?"●":k==="blocked"?"!":"";
    const flag = (k==="wait" && p.mode==="ask") ? `<span class="node__flag" title="остановка на вопросах">🚩</span>` : "";
    return `${i?`<span class="seg-line${kind(cs[i-1])==="done"?" seg-line--done":""}"></span>`:""}
      <button class="node node--${k}${c.id===selId?" is-sel":""}" type="button" data-sel="${esc(c.id)}" title="${esc(c.theme)}">
      ${flag}<span class="node__dot">${dot}</span><span class="node__n">S${i+1}</span></button>`;}).join("")}</div>`;
}
function inspPlan(p){
  const cs = p.cardIds.map(card).filter(Boolean);
  const done = cs.filter((c)=>c.column==="ready").length;
  const rest = cs.length - done;
  const a = p.acceptance;
  return `<div class="insp__crumb">⚡ прогон · ${esc(p.branch)}${p.archived?" · свёрнут":""}</div>
    <h1 class="insp__t">${esc(p.goal)}</h1>
    <div class="insp__facts">
      <span class="chip">${done} / ${cs.length} этапов</span>
      <span class="chip chip--${p.mode==="auto"?"ok":"warn"}">${p.mode==="auto"?"auto · ✓ пройдёт сама":"ask · 🚩 остановит "+rest+" раз"}</span>
      <span class="chip chip--branch">⎇ ${esc(p.branch)}</span>
      ${a?`<span class="chip chip--${a.passed?"ok":"bad"}">приёмка ${a.pass}/${a.total}</span>`:""}
      ${p.pr?`<a class="chip" href="${esc(p.pr.url)}" target="_blank" rel="noopener">PR ${esc(p.pr.url.split("/").pop())} →</a>`:""}
      <span class="chip">запущен ${esc(since(p.createdAt))} назад</span>
    </div>
    ${trackHTML(p, null)}
    <div class="box"><div class="box__k">Этапы · порядок исполнения</div>
      ${cs.map((c,i)=>{
        const k=kind(c), wait=(c.dependsOn||[]).map(card).filter((d)=>d&&d.column!=="ready");
        return `<div class="srow" data-sel="${esc(c.id)}">
          <span class="srow__m" style="color:${k==="done"?"var(--s-ready)":k==="live"?"var(--s-implementing)":"var(--ink-faint)"}">${k==="done"?"✓":k==="live"?"●":k==="blocked"?"!":"○"}</span>
          <span class="srow__id">S${i+1}</span>
          <span class="srow__t">${esc(shortTheme(c.theme))}</span>
          <span class="srow__r">${k==="done"?"готово":k==="live"?esc(PHASE[c.column])+" · "+esc(since(c.lastColumnChangeAt)):
            wait.length?`🔒 ждёт S${p.cardIds.indexOf(wait[0].id)+1}`:c.queued?"⏳ слот проекта занят":"—"}</span></div>`;}).join("")}
    </div>
    ${p.closeStep==="awaiting-merge"?`<div class="box" style="border-color:rgba(139,83,224,.4)">
      <div class="box__k">Гейт человека</div>
      <div class="box__v">Приёмка зелёная, PR собран. Дальше доска не пойдёт без твоей кнопки.</div>
      <div class="acts" style="margin-top:10px"><button class="mini mini--merge" type="button" data-toast="Прототип: мерж ветки в main">Мерж в main</button>
      <button class="mini" type="button" data-toast="Прототип: открывается PR">Открыть PR</button></div></div>`:""}
    ${p.notice?`<div class="box"><div class="box__k">Итог закрытия</div><div class="box__v">${esc(p.notice)}</div></div>`:""}
    ${p.archived?`<div class="acts"><button class="mini" type="button" data-sweep="${esc(p.id)}">Убрать ${p.cardIds.filter(card).length} карточек с доски</button></div>`:""}`;
}
function inspCard(c){
  const p = c.planId && plan(c.planId);
  const k = kind(c);
  const wait = (c.dependsOn||[]).map(card).filter((d)=>d&&d.column!=="ready");
  return `<div class="insp__crumb">${p?`<a data-sel="${esc(p.id)}">⚡ ${esc(p.goal.slice(0,52))}…</a> ·`:""} ${esc(c.project)}</div>
    <h1 class="insp__t">${esc(shortTheme(c.theme))}</h1>
    <div class="insp__facts">
      <span class="chip"><span class="lamp${k==="live"?" lamp--live":""}" style="color:${LAMP[c.column]};background:${LAMP[c.column]}"></span>${esc(PHASE[c.column])}</span>
      <span class="chip">${esc(since(c.lastColumnChangeAt))} на станции</span>
      ${p?`<span class="chip">этап ${p.cardIds.indexOf(c.id)+1} из ${p.cardIds.length}</span>`:""}
      ${c.files?`<span class="chip">⎘ файлов: ${c.files}</span>`:""}
      ${c.acceptance?`<span class="chip">✓ приёмка: ${c.acceptance} п.</span>`:""}
      ${c.rigor==="grace"?`<span class="chip">grace</span>`:""}
      ${wait.length?`<span class="chip chip--warn">🔒 ждёт S${p?p.cardIds.indexOf(wait[0].id)+1:"—"}</span>`:""}
    </div>
    ${p?trackHTML(p, c.id):""}
    ${c.column==="asking"&&c.questions>0?`<div class="box" style="border-color:rgba(230,161,30,.5)">
      <div class="box__k">Ждёт тебя</div><div class="box__v">${c.questions} вопрос(ов) по функционалу.</div>
      <div class="acts" style="margin-top:10px"><button class="mini mini--go" type="button" data-toast="Прототип: открывается опросник">Ответить</button></div></div>`:""}
    ${c.blockReason?`<div class="box" style="border-color:rgba(211,63,53,.4)"><div class="box__k">Почему стоим</div><div class="box__v">${esc(c.blockReason)}</div></div>`:""}
    <div class="box"><div class="box__k">Постановка</div><div class="box__v">${esc(c.desc || "Описание не задано.")}</div></div>
    <div class="acts">
      <button class="mini" type="button" data-toast="Прототип: просмотрщик «План · Лог»">⊟ лог</button>
      <button class="mini" type="button" data-toast="Прогон перезапущен">↻ перезапуск</button>
      <button class="mini" type="button" data-toast="Этап на паузе — очередь сохранена">⏸ пауза</button>
    </div>`;
}
function renderInsp(){
  const p = plan(sel), c = card(sel);
  const body = p ? inspPlan(p) : c ? inspCard(c)
    : `<div class="box"><div class="box__k">Пусто</div><div class="box__v">Выбери прогон или этап слева.</div></div>`;
  const w = document.querySelector(".reg").clientWidth;
  document.getElementById("insp").innerHTML = `<div class="insp__wrap">${body}
    <div class="gauge">
      <span>сетка v4-C: реестр <b>${w}px</b> · панель <b>${document.getElementById("insp").clientWidth}px</b> · горизонтального скролла <b>нет</b> (было <s>≈2500px</s>)</span>
      <span>областей прокрутки: <b>2</b> (было <s>11</s>)</span>
      <span>строк реестра в поле зрения: <b>≈${Math.floor((window.innerHeight-120)/parseInt(getComputedStyle(document.body).getPropertyValue("--row")))}</b> (было <s>≈2 карточки</s>)</span>
    </div></div>`;
}

/* ── взаимодействие ───────────────────────────────────────────────────── */
let toastTimer=null;
function toast(html){ const t=document.getElementById("toast"); t.innerHTML=html; t.dataset.open="1";
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>(t.dataset.open="0"),2600); }
document.addEventListener("click",(e)=>{
  const sw = e.target.closest("[data-sweep]");
  if (sw){ const p=plan(sw.dataset.sweep); return toast(`Убрано с доски: <b>${p.cardIds.filter(card).length} карточек</b> · история и PR остались`); }
  const tt = e.target.closest("[data-toast]"); if (tt) return toast(esc(tt.dataset.toast));
  const s = e.target.closest("[data-sel]");
  if (s){ sel = s.dataset.sel; renderReg(); renderInsp();
    document.querySelector(".insp").scrollTop = 0; }
});
document.getElementById("density").addEventListener("click",(e)=>{
  const b=e.target.closest("[data-d]"); if(!b) return;
  document.body.dataset.d=b.dataset.d;
  document.querySelectorAll("#density .seg__opt").forEach((o)=>o.classList.toggle("is-on",o===b));
  renderInsp();
});
const findEl = document.getElementById("find");
findEl.addEventListener("input",()=>{ q=findEl.value.trim().toLowerCase(); renderReg(); });
document.addEventListener("keydown",(e)=>{
  if (e.key==="/" && document.activeElement!==findEl){ e.preventDefault(); findEl.focus(); }
  if (e.key==="Escape"){ findEl.value=""; q=""; renderReg(); }
  /* стрелки по реестру: при WIP=1 навигация по списку — основной жест, не драг */
  if (e.key==="ArrowDown"||e.key==="ArrowUp"){
    const items=[...document.querySelectorAll("[data-sel]")].filter((el)=>el.classList.contains("item"));
    const i=items.findIndex((el)=>el.dataset.sel===sel);
    const next=items[Math.min(items.length-1,Math.max(0,i+(e.key==="ArrowDown"?1:-1)))];
    if(next){ e.preventDefault(); sel=next.dataset.sel; renderReg(); renderInsp(); next.scrollIntoView({block:"nearest"}); }
  }
});
window.addEventListener("resize",renderInsp);
/* по умолчанию выбрана работающая карточка — то единственное, что сейчас движется */
sel = (DATA.cards.find((c)=>AGENT.has(c.column)) || DATA.cards[0] || {}).id;
renderReg(); renderInsp();
</script>
</body>
